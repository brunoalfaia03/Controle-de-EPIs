<meta name="theme-color" content="#1c3354">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: almoxarifado em fichas — cabeçalho fixo com abas, conteúdo em coluna única até 1100px, navegação inferior no celular. */
:root{
  --navy:#1c3354; --navy-2:#2a4670; --teal:#1e9e8a; --amber:#e8a43c;
  --bg:#eef2f6; --surface:#ffffff; --sunk:#e3e9f0; --line:#cfd8e2; --ink:#16233a; --muted:#56647a;
  --accent:#167a6b; --accent-ink:#ffffff; --accent-soft:#d4eee9;
  --sol:#2459a8; --sol-soft:#dfe8f6; --est:#2e7d3a; --est-soft:#dcefdf; --com:#c25a12; --com-soft:#fbe7d6;
  --ok:#2e7d3a; --warn:#a86a00; --warn-soft:#fbefd2; --bad:#b3261e; --bad-soft:#f8dcd9;
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0f1d33; --navy-2:#1c3354; --teal:#5cc0b0; --amber:#f0b456;
  --bg:#0e1522; --surface:#16202f; --sunk:#1e2a3c; --line:#2e3d53; --ink:#e5ebf3; --muted:#9aa8bb;
  --accent:#5cc0b0; --accent-ink:#0b1a17; --accent-soft:#183a38;
  --sol:#7ea6ea; --sol-soft:#1e2b40; --est:#6cc47a; --est-soft:#1c3221; --com:#f09a5a; --com-soft:#3a2615;
  --ok:#6cc47a; --warn:#e6b04a; --warn-soft:#3a2f14; --bad:#f08a80; --bad-soft:#41201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0f1d33; --navy-2:#1c3354; --teal:#5cc0b0; --amber:#f0b456;
  --bg:#0e1522; --surface:#16202f; --sunk:#1e2a3c; --line:#2e3d53; --ink:#e5ebf3; --muted:#9aa8bb;
  --accent:#5cc0b0; --accent-ink:#0b1a17; --accent-soft:#183a38;
  --sol:#7ea6ea; --sol-soft:#1e2b40; --est:#6cc47a; --est-soft:#1c3221; --com:#f09a5a; --com-soft:#3a2615;
  --ok:#6cc47a; --warn:#e6b04a; --warn-soft:#3a2f14; --bad:#f08a80; --bad-soft:#41201d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:var(--f-head);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.5rem;color:var(--navy-2)} h3{font-size:1.15rem}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2{color:var(--ink)}}
:root[data-theme="dark"] h2{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:#fff;border-bottom:3px solid var(--teal)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .mark{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;padding:2px}
.brand .mark img{width:100%;height:100%;display:block}
.brand h1{font-size:1.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:#b9c6d8;font-size:.78rem;font-family:var(--f-body);font-weight:400;letter-spacing:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:#c9d4e3}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:#4fd1a5;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.who{display:flex;align-items:center;gap:8px;border:1px solid #ffffff33;background:#ffffff14;color:#fff;border-radius:999px;padding:3px 10px 3px 3px;cursor:pointer}
.who img{width:28px;height:28px;border-radius:50%}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 14px;color:#b9c6d8;text-decoration:none;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a.on{color:#fff;border-color:var(--amber)}
.tabs a:hover{color:#fff}
.who .role{background:#fff}
.tabs a .badge{margin-left:6px}
nav.bottom{display:none}
@media (max-width:760px){
  .tabs{display:none}
  .brand small,.live span{display:none}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.7rem;color:var(--muted);text-decoration:none;position:relative}
  nav.bottom a.on{color:var(--accent);font-weight:600}
  nav.bottom svg{width:22px;height:22px}
  nav.bottom .badge{position:absolute;top:3px;left:calc(50% + 6px)}
  main{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
main{padding-block:20px 40px;display:grid;gap:20px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center;font-weight:600}

.pagehead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h3{margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font-family:var(--f-head);font-size:1.9rem;font-weight:700;line-height:1.1}
.kpi small{color:var(--muted)}

.role{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px}
.role.sol{background:var(--sol-soft);color:var(--sol)} .role.est{background:var(--est-soft);color:var(--est)} .role.com{background:var(--com-soft);color:var(--com)} .role.adm{background:var(--sunk);color:var(--muted)}
.queue{border-left:4px solid var(--line)}
.queue.sol{border-left-color:var(--sol)} .queue.est{border-left-color:var(--est)} .queue.com{border-left-color:var(--com)}
.queue.mine{box-shadow:0 0 0 2px var(--accent-soft)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--est-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--sol-soft);color:var(--sol)} .pill.mute{background:var(--sunk);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.list{display:grid;gap:0}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .t{min-width:0}
.item .t b{display:block;overflow-wrap:anywhere}
.item .t small{color:var(--muted);overflow-wrap:anywhere}
.clickable{cursor:pointer}
.clickable:hover{background:color-mix(in srgb,var(--sunk) 50%,transparent)}
.empty{color:var(--muted);padding:12px 0}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);position:sticky;top:0}
td.n,th.n{text-align:right}
td.wrapcell{white-space:normal;min-width:180px}
tr:last-child td{border-bottom:0}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1;min-width:180px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f > span{font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.overlay{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:761px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:761px){.sheet{border-radius:14px;padding:22px}}
.sheet header{display:flex;justify-content:space-between;align-items:start;gap:12px}
.sheet header p{margin:4px 0 0;color:var(--muted)}
.x{border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.9rem;color:var(--muted)}
.note.bad{background:var(--bad-soft);color:var(--bad)} .note.warn{background:var(--warn-soft);color:var(--warn)} .note.ok{background:var(--est-soft);color:var(--ok)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:.72rem;color:var(--muted)}
.steps div{border-top:4px solid var(--line);padding-top:4px}
.steps div.done{border-color:var(--accent);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px)}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
.muted{color:var(--muted)}
.sizegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sizegrid label{display:grid;gap:2px;font-size:.75rem;color:var(--muted);text-align:center}
.sizegrid input{text-align:center;padding:6px 4px}
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.dash{grid-template-columns:1fr}}
.dashside{display:grid;gap:16px;align-content:start;min-width:0}
.legend{font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle}
.sw.n,.bt i.n{background:var(--accent)} .sw.s,.bt i.s{background:color-mix(in srgb,var(--accent) 45%,var(--surface))} .sw.h,.bt i.h{background:var(--line)}
.sw.c0,.split i.c0{background:var(--accent)} .sw.c1,.split i.c1{background:var(--com)} .sw.c2,.split i.c2{background:var(--sol)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(110px,34%) 1fr 64px;gap:10px;align-items:center;font-size:.85rem}
.bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{display:flex;height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bt i{display:block;height:100%}
.bv{text-align:right;font-variant-numeric:tabular-nums}
.bv small{color:var(--muted);font-weight:400}
.split{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.split i{display:block;height:100%}
.avail{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.alerta{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad-soft) 35%,var(--surface))}
.alerta h3{gap:10px}
.dash2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:860px){.dash2{grid-template-columns:1fr}}
.catbox{display:grid;gap:12px;border-top-width:4px}
.catbox.epi{border-top-color:var(--accent)} .catbox.farda{border-top-color:var(--com)}
.cath{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cath h3{font-size:1.35rem}
.catk{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.catk div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.catk span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.catk b{font-family:var(--f-head);font-size:1.5rem;line-height:1.1}
.rows{display:grid}
.prow{display:grid;gap:5px;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.ptop{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 52px;gap:10px;align-items:center;font-size:.9rem}
.pn{overflow-wrap:anywhere;font-weight:500}
.pv{text-align:right;font-family:var(--f-head);font-size:1.1rem}
.prow.low .pv{color:var(--bad)}
.szchip.hig{background:var(--sunk)}
.semsaldo{margin:0;font-size:.82rem;color:var(--muted)}
.dashlegend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;align-items:center}
.dashlegend > span{display:inline-flex;gap:5px;align-items:center}
.alerta.compacta .chips{gap:6px}
.alchip{display:inline-flex;gap:6px;align-items:baseline;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));font-size:.85rem}
.alchip b{color:var(--bad);font-variant-numeric:tabular-nums}
.av{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;min-width:0;align-content:start}
.avh{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.avh b{overflow-wrap:anywhere}
.avh span{white-space:nowrap;font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.szchip{display:inline-flex;align-items:baseline;gap:4px;padding:2px 7px;border-radius:6px;background:var(--est-soft);color:var(--ink);font-size:.8rem;font-variant-numeric:tabular-nums}
.szchip b{font-size:.7rem;color:var(--muted);font-weight:600}
.szchip.warn{background:var(--warn-soft)} .szchip.bad{background:var(--bad-soft)}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#login[hidden]{display:none}
#login .card{width:100%;max-width:380px;display:grid;gap:14px}
#login .logo{display:block;width:100%;max-width:300px;margin:0 auto;background:#fff;border-radius:12px;padding:10px 14px}
#login .card{border-top:4px solid var(--teal)}
#login h2{color:var(--navy-2)}
#login h2{text-align:center} #login p{margin:0;text-align:center}
#login .err{color:var(--bad);font-size:.9rem;text-align:center;min-height:1.2em}
#login input{font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

// ---------- regras de estoque ----------
function movDelta(m){
  const d={n:0,s:0,h:0}; const q=Number(m.qtd)||0;
  if(m.tipo==="Higienização concluída"){ d.h-=q; d.s+=q; return d; }
  const t=TIPOS[m.tipo]; const k=CK[m.cond]||"n"; d[k]+= (t?t.sign:0)*q; return d;
}
function solStatus(s){
  if(s.cancelada) return "Cancelada";
  if(s.devolucao) return "Devolvido";
  if(s.desligamento) return s.entrega ? "Aguardando devolução" : "Encerrada sem entrega";
  if(s.entrega) return "Em uso";
  if(s.tomador || !(s.kit||[]).length) return "Fornecido pelo tomador";
  return "Aguardando entrega";
}
const STATUS_PILL = {"Aguardando entrega":"warn","Em uso":"ok","Aguardando devolução":"info","Devolvido":"mute","Cancelada":"mute","Fornecido pelo tomador":"mute","Encerrada sem entrega":"mute"};
function recebidoCompra(c){ return S.movs.filter(m=>m.tipo==="Entrada de compra" && m.pedido && m.pedido===c.pedido && m.item===c.item && String(m.tam)===String(c.tam)).reduce((a,m)=>a+(Number(m.qtd)||0),0); }
function compraStatus(c){ const r=recebidoCompra(c); const q=Number(c.qtd)||0; if(c.cancelada) return ["Cancelado","mute"]; if(r>=q) return ["Recebido","ok"]; if(c.previsao && c.previsao<today()) return [r>0?"Parcial atrasado":"Atrasado","bad"]; return [r>0?"Parcial":"Aguardando","warn"]; }
function computeStock(){
  const map=new Map();
  const get=(item,tam)=>{ const k=sku(item,tam); if(!map.has(k)) map.set(k,{sku:k,item,tam:String(tam),n:0,s:0,h:0,res:0,aberto:0,usado:false}); return map.get(k); };
  (S.cat?.itens||[]).forEach(i=>sizesOf(i.nome).forEach(t=>get(i.nome,t)));
  S.movs.forEach(m=>{ if(!m.item) return; const r=get(m.item,m.tam), d=movDelta(m); r.n+=d.n; r.s+=d.s; r.h+=d.h; r.usado=true; });
  S.sols.forEach(s=>{
    const st=solStatus(s);
    (s.kit||[]).forEach(l=>{ const r=get(l.item,l.tam), q=Number(l.qtd)||0;
      if(s.entrega){ r[l.cond==="Seminovo"?"s":"n"]-=q; r.usado=true; }
      if(s.devolucao){ r.h+=Number(l.qtdDev)||0; }
      if(st==="Aguardando entrega"){ r.res+=q; r.usado=true; }
    });
  });
  S.compras.forEach(c=>{ if(c.cancelada) return; const r=get(c.item,c.tam); r.aberto+=Math.max(0,(Number(c.qtd)||0)-recebidoCompra(c)); if(r.aberto) r.usado=true; });
  map.forEach(r=>{
    const p=S.params[r.sku]||{}; r.ponto=(p.ponto===""||p.ponto==null)?null:Number(p.ponto); r.max=(p.max===""||p.max==null)?null:Number(p.max); r.local=p.local||"";
    r.disp=r.n+r.s; r.proj=r.disp-r.res; r.custo=Number(itemInfo(r.item).custo)||0;
    if(r.n<0||r.s<0||r.h<0){ r.sit="Conferir"; r.sitC="bad"; }
    else if(r.ponto==null){ if(r.proj<0){ r.sit="Falta p/ kits"; r.sitC="bad"; } else if(r.disp>0||r.usado){ r.sit="Sem ponto de reposição"; r.sitC="mute"; } else { r.sit="—"; r.sitC="mute"; } }
    else if(r.proj<=r.ponto){ if(r.proj+r.aberto>r.ponto){ r.sit="Compra a caminho"; r.sitC="info"; } else { r.sit="Comprar"; r.sitC="bad"; } }
    else { r.sit="OK"; r.sitC="ok"; }
    const alvo = r.max!=null ? r.max : (r.ponto!=null ? 2*r.ponto : 0);
    r.sug = (r.sit==="Comprar"||r.sit==="Falta p/ kits") ? Math.max(1, alvo - r.proj - r.aberto) : 0;
    if(r.ponto!=null||r.local) r.usado=true;
  });
  const order=(S.cat?.itens||[]).map(i=>i.nome);
  return [...map.values()].sort((a,b)=>{ const ia=order.indexOf(a.item), ib=order.indexOf(b.item); if(ia!==ib) return ia-ib; const sz=sizesOf(a.item); return sz.indexOf(a.tam)-sz.indexOf(b.tam); });
}
function montarKit(emp,func,tc,tr){
  const e=empresaInfo(emp); if(e && e.resp==="Tomador") return {tomador:true,kit:[]};
  const linhas=(S.cat?.kits||[]).filter(k=>k.empresa===emp && k.funcao===func);
  return {tomador:false, kit:linhas.map(k=>{ const t=itemInfo(k.item).tipoTam; return {item:k.item, qtd:Number(k.qtd)||1, tam: t==="Calçado"?(tc||""):t==="Roupa"?(tr||""):"Único"}; })};
}

function eventosES(){
  const ev=[]; const custo=it=>Number(itemInfo(it).custo)||0;
  S.movs.forEach(m=>{ const d=movDelta(m); const t=d.n+d.s+d.h; const q=Number(m.qtd)||0;
    const tipo=m.tipo==="Higienização concluída"?"Interno":t>0?"Entrada":"Saída";
    ev.push({data:m.data,tipo,mov:m.tipo,item:m.item,tam:m.tam,cond:m.tipo==="Higienização concluída"?"Em hig. → Seminovo":m.cond,ent:tipo==="Entrada"?q:0,sai:tipo==="Saída"?q:0,ref:[m.doc,m.pedido&&"pedido "+m.pedido,m.obs].filter(Boolean).join(" · "),por:m.porId,valor:q*(m.cond==="Novo"?custo(m.item):0)}); });
  S.sols.forEach(s=>{
    if(s.entrega) (s.kit||[]).forEach(l=>ev.push({data:s.entrega.data,tipo:"Saída",mov:"Entrega de kit (admissão)",item:l.item,tam:l.tam,cond:l.cond||"Novo",ent:0,sai:Number(l.qtd)||0,ref:`${s.colaborador} · ${s.empresa} · ${s.num}`,por:s.entrega.porId,valor:(l.cond==="Seminovo"?0:custo(l.item))*(Number(l.qtd)||0)}));
    if(s.devolucao) (s.kit||[]).forEach(l=>{ const q=Number(l.qtdDev)||0; if(q) ev.push({data:s.devolucao.data,tipo:"Entrada",mov:"Devolução (desligamento)",item:l.item,tam:l.tam,cond:"Em higienização",ent:q,sai:0,ref:`${s.colaborador} · ${s.empresa} · ${s.num}`,por:s.devolucao.porId,valor:0}); });
  });
  return ev;
}

function acharItem(txt,kitHint){

  String(txt||"").split(/[;\n|+]|,(?!\d)/).map(x=>x.trim()).filter(Boolean).forEach(seg=>{
    let s=seg, qtd=null; const mq=s.match(/^(\d+)\s*(x|un|und|pcs|pç|pc)?\s+(.*)$/i); if(mq){ qtd=+mq[1]; s=mq[3]; }
    const toks=s.split(/\s+/); let tam=""; const last=(toks[toks.length-1]||"").toUpperCase().replace(/^(TAM|N|Nº|NO)\.?/,"");
    if(ALLSIZES.includes(last)){ tam=last; toks.pop(); if(/^(tam|tamanho|n|nº|numero)\.?$/i.test(toks[toks.length-1]||"")) toks.pop(); }
    const it=acharItem(toks.join(" "),kitHint); if(!it){ erros.push(seg); return; }
    const tipo=itemInfo(it.nome).tipoTam; if(!SIZES[tipo].includes(tam)) tam=tipo==="Calçado"?tc:tipo==="Roupa"?tr:"Único";
    if(tipo==="Único") tam="Único";
    const ex=hintQtd(kitHint,it.nome);
    out.push({item:it.nome,qtd:qtd||ex||1,tam:tam||"",duvida:!it.certo,orig:seg});
  });
  return {out,erros};
}
const hintQtd=(kit,nome)=>{ const l=(kit||[]).find(x=>x.item===nome); return l?l.qtd:null; };
function achaEmpresa(v){ const n=norm(v); if(!n) return null; const es=S.cat.empresas||[]; return (es.find(e=>norm(e.nome)===n)||es.find(e=>norm(e.nome).startsWith(n+" ")||n.startsWith(norm(e.nome)+" "))||es.find(e=>n.length>=3&&norm(e.nome).includes(n)))?.nome||null; }
function achaFuncao(emp,v){ const n=norm(v); if(!n||!emp) return null; const fs=funcoesDe(emp); return fs.find(f=>norm(f)===n)||fs.find(f=>norm(f).includes(n)||n.includes(norm(f)))||(fs.includes("Todas")?"Todas":null); }
function dataISO(v){
  if(v instanceof Date && !isNaN(v)) { const d=new Date(v.getTime()+12*3600e3); return d.toISOString().slice(0,10); }
  const s=String(v||"").trim(); let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0]; return "";
}
function analisarLinhas(rows){
  // acha a linha de cabeçalho (até a 15ª) que tenha colaborador/nome
  let hi=rows.findIndex((r,i)=>i<15 && r.some(c=>COLS.colab.includes(norm(c))));
  if(hi<0) return {erro:"Não achei a coluna do colaborador. A primeira linha precisa ter um título como “Colaborador” ou “Nome”."};
  const map=mapHeaders(rows[hi]);
  if(map.emp==null) return {erro:"Não achei a coluna da empresa. Use um título como “Empresa” ou “Tomador”."};
  const abertos=S.sols.filter(s=>["Aguardando entrega","Em uso","Aguardando devolução"].includes(solStatus(s)));
  const res=[];
  rows.slice(hi+1).forEach((r,ix)=>{
    const g=k=>map[k]==null?"":r[map[k]]; const colab=String(g("colab")).trim(); if(!colab) return;
    const avisos=[], erros=[];
    const empRaw=String(g("emp")).trim(), emp=achaEmpresa(empRaw); if(!emp) erros.push(empRaw?`Empresa “${empRaw}” não cadastrada`:"Sem empresa");
    const ei=emp?empresaInfo(emp):null; const tomador=!!(ei&&ei.resp==="Tomador");
    const funcRaw=String(g("func")).trim(); const func=achaFuncao(emp,funcRaw);
    let tc=String(g("tc")).trim().toUpperCase().replace(/\.0$/,""), tr=String(g("tr")).trim().toUpperCase();
    if(tc && !SIZES["Calçado"].includes(tc)){ avisos.push(`Calçado “${tc}” fora da numeração 34-46`); tc=""; }
    if(tr && !SIZES["Roupa"].includes(tr)){ const t2=tr.replace("EXG","XG").replace("XGG","XXG").replace("EG","XG"); if(SIZES["Roupa"].includes(t2)) tr=t2; else { avisos.push(`Roupa “${tr}” não reconhecido`); tr=""; } }
    const manual=(emp&&func&&!tomador)?montarKit(emp,func,tc,tr).kit:[];
    let kit=[];
    Object.entries(map.itemCols).forEach(([ci,nome])=>{ const v=r[ci]; if(v===""||v==null||/^(nao|n|0|-)$/i.test(norm(v))) return; const l=lerQtdTam(v,nome,tc,tr); if(!/\d|[A-Z]/i.test(String(v))) return; if(l.qtd===1 && hintQtd(manual,nome) && !/^\s*\d+\s*(x|un)/i.test(String(v))) l.qtd=hintQtd(manual,nome); kit.push(l); });
    if(map.itens!=null && String(g("itens")).trim()){ const p=parseItensTexto(g("itens"),tc,tr,manual); kit.push(...p.out); p.erros.forEach(x=>avisos.push(`Item “${x}” não reconhecido (ignorado)`)); p.out.filter(l=>l.duvida).forEach(l=>avisos.push(`“${l.orig}” lido como ${l.item}: confira`)); }
    let origem="arquivo";
    if(!kit.length){ kit=manual; origem="manual"; }
    if(tomador && origem==="manual") kit=[];
    if(!kit.length && !tomador && emp){ if(!func) erros.push(funcRaw?`Função “${funcRaw}” sem kit no manual de ${emp||"?"} e nenhum item no arquivo`:"Sem função e sem itens no arquivo"); else erros.push("Kit vazio"); }
    kit.forEach(l=>{ if(!l.tam) erros.push(`Falta tamanho de ${l.item}`); });
    // junta itens repetidos
    const kj=[]; kit.forEach(l=>{ const o=kj.find(x=>x.item===l.item&&x.tam===l.tam); if(o) o.qtd+=l.qtd; else kj.push({item:l.item,tam:l.tam,qtd:l.qtd}); });
    const mat=String(g("mat")).trim().replace(/\.0$/,"");
    const dup=abertos.find(s=>(mat&&s.matricula===mat)||norm(s.colaborador)===norm(colab));
    if(dup) avisos.push(`Já tem admissão aberta (${dup.num})`);
    res.push({linha:hi+ix+2,colab,mat,emp:emp||empRaw,func:func||funcRaw||"",data:dataISO(g("data"))||today(),tc,tr,tomador,kit:kj,origem,obs:String(g("obs")).trim(),avisos,erros,inc:!erros.length&&!dup});
  });
  return {linhas:res,map};
}

function formEntrega(s){
  const st=stockCache; const kit=s.kit.map(l=>{ const r=st.find(x=>x.sku===sku(l.item,l.tam)); return {...l, cond:(r&&r.n>=l.qtd)?"Novo":(r&&r.s>=l.qtd)?"Seminovo":"Novo"}; });
  const draw=()=>{
    $("#actBox").innerHTML=`<form id="fEnt" class="card" style="display:grid;gap:12px"><h3><span class="role est">Estoquista</span> Entrega do kit</h3>
    <div class="tablewrap"><table><thead><tr><th>Item</th><th>Tam.</th><th class="n">Qtd</th><th>Sai como</th><th>Saldo</th></tr></thead><tbody>${kit.map((l,i)=>{ const r=stockCache.find(x=>x.sku===sku(l.item,l.tam))||{n:0,s:0}; const have=l.cond==="Seminovo"?r.s:r.n; return `<tr><td class="wrapcell">${esc(l.item)}</td><td><select data-et="${i}" style="width:84px">${opts(sizesOf(l.item),l.tam)}</select></td><td class="n">${l.qtd}</td><td><select data-ec="${i}" style="width:120px">${opts(["Novo","Seminovo"],l.cond)}</select></td><td>${have>=l.qtd?`<span class="pill ok">${have} ${l.cond.toLowerCase()}</span>`:`<span class="pill bad">só ${Math.max(0,have)}</span>`}</td></tr>`; }).join("")}</tbody></table></div>
    <div class="form"><label class="f"><span>Data da entrega</span><input type="date" id="eData" value="${today()}" required></label>
    <label class="chk" style="align-self:end"><input type="checkbox" id="eFicha" checked> Ficha de EPI assinada (NR-6)</label></div>
    <div class="row" style="justify-content:flex-end"><button class="btn pri" id="eSave">Confirmar entrega</button></div></form>`;
    $("#actBox").querySelectorAll("[data-ec]").forEach(x=>x.onchange=()=>{ kit[+x.dataset.ec].cond=x.value; draw(); });
    $("#actBox").querySelectorAll("[data-et]").forEach(x=>x.onchange=()=>{ kit[+x.dataset.et].tam=x.value; draw(); });
    $("#fEnt").onsubmit=async e=>{ e.preventDefault();
      const falta=kit.filter(l=>{ const r=stockCache.find(x=>x.sku===sku(l.item,l.tam))||{n:0,s:0}; return (l.cond==="Seminovo"?r.s:r.n)<l.qtd; });
      if(falta.length){ toast("Sem saldo para: "+falta.map(l=>l.item+" "+l.tam).join(", ")+". Dê entrada ou troque a condição."); return; }
      $("#eSave").disabled=true;
      try{ await S.db.collection("solicitacoes").doc(s._id).update({kit:kit.map(l=>({item:l.item,tam:l.tam,qtd:l.qtd,cond:l.cond})),entrega:{data:$("#eData").value,porId:S.me.id,ficha:$("#eFicha").checked}}); closeModal(); toast("Entrega registrada. Estoque baixado."); }
      catch(err){ failWrite(err); $("#eSave").disabled=false; }
    };
    $("#actBox").scrollIntoView({block:"nearest"});
  };
  draw();
}

function formDev(s){

<p>Declaro ter recebido os itens acima, gratuitamente, e ter sido orientado sobre o uso, a guarda e a conservação (NR-6, item 6.6.1). Comprometo-me a devolvê-los no desligamento ou na troca.</p>
<div class="ass"><div>Assinatura do colaborador</div><div>Responsável pela entrega</div></div></html>`;

}

function vMov(){

  return `<div class="pagehead"><div><h2>Movimentar</h2><p><span class="role est">Estoquista</span> Tudo que mexe no estoque e não é admissão nem devolução de desligamento (essas saem sozinhas das fichas de admissão).</p></div></div>
  <div class="grid2">${Object.entries(TIPOS).map(([t,i])=>`<button class="card clickable" style="text-align:left;cursor:pointer" data-act="mov" data-tipo="${esc(t)}"><h3>${esc(t)}</h3><p class="muted" style="margin:4px 0 0">${esc(i.help)}</p></button>`).join("")}</div>
  <div class="card"><h3>Últimos lançamentos</h3><div class="list">${recentes.map(movRow).join("")||`<div class="empty">Nenhum lançamento ainda.</div>`}</div></div>`;

function movRow(m){ const d=movDelta(m); const tot=d.n+d.s+d.h; return `<div class="item"><div class="t"><b>${esc(m.tipo)} · ${esc(m.item)} ${esc(m.tam)}</b><small>${fmtD(m.data)} · ${esc(m.cond)}${m.pedido?` · pedido ${esc(m.pedido)}`:""}${m.doc?` · ${esc(m.doc)}`:""} · ${esc(nameOf(m.porId))}${m.obs?` · ${esc(m.obs)}`:""}</small></div><span class="pill ${tot>0?"ok":tot<0?"bad":"mute"} num">${m.tipo==="Higienização concluída"?"→ seminovo "+m.qtd:(tot>0?"+":"")+tot}</span></div>`; }
function formMov(tipo,pre={}){
  const T=TIPOS[tipo]; const itens=(S.cat.itens||[]).map(i=>i.nome);
  const abertos=S.compras.filter(c=>!c.cancelada && recebidoCompra(c)<(Number(c.qtd)||0));
  modal(`<header><div><h3>${esc(tipo)}</h3><p>${esc(T.help)}</p></div><button class="x" data-close aria-label="Fechar">×</button></header>
  <form id="fMov" class="form">
    ${tipo==="Entrada de compra"?`<label class="f full"><span>Pedido</span><select id="mPed">${opts([],"", abertos.length?"Escolha a linha do pedido":"Nenhum pedido em aberto")}${abertos.map(c=>`<option value="${esc(c._id)}">${esc(c.pedido)} · ${esc(c.item)} ${esc(c.tam)} · faltam ${(Number(c.qtd)||0)-recebidoCompra(c)}</option>`).join("")}<option value="__sem">Sem pedido (entrada avulsa)</option></select></label>`:""}
    <label class="f full"><span>Item</span><select id="mItem" required>${opts(itens,pre.item||"","Escolha o item")}</select></label>
    <label class="f"><span>Tamanho</span><select id="mTam" required></select></label>
    <label class="f"><span>Condição</span><select id="mCond">${opts(T.conds,pre.cond||T.conds[0])}</select></label>
    <label class="f"><span>Quantidade</span><input id="mQtd" type="number" min="1" required value="${pre.qtd||""}"></label>
    <label class="f"><span>Data</span><input id="mData" type="date" value="${today()}" required></label>
    ${tipo==="Entrada de compra"?`<label class="f"><span>NF / documento</span><input id="mDoc" placeholder="NF 27253"></label>`:""}
    <label class="f full"><span>${/Saída|Retorno/.test(tipo)?"Colaborador e motivo":"Observações"}</span><input id="mObs"></label>
    <div class="full" id="mInfo"></div>
    <div class="full row" style="justify-content:flex-end"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" id="mSave">Lançar</button></div>
  </form>`, ()=>{
    const it=$("#mItem"), tm=$("#mTam");
    const fillT=(sel)=>{ tm.innerHTML=it.value?opts(sizesOf(it.value),sel||"",sizesOf(it.value).length>1?"Escolha":null):`<option value="">—</option>`; info(); };
    const info=()=>{ const r=stockCache.find(x=>x.sku===sku(it.value,tm.value)); $("#mInfo").innerHTML=r?`<div class="note">Hoje: ${r.n} novo · ${r.s} seminovo · ${r.h} em higienização${r.res?` · ${r.res} reservado`:""}</div>`:""; };
    it.onchange=()=>fillT(); tm.onchange=info; fillT(pre.tam);
    if($("#mPed")) $("#mPed").onchange=e=>{ const c=S.compras.find(x=>x._id===e.target.value); if(c){ it.value=c.item; fillT(c.tam); $("#mQtd").value=(Number(c.qtd)||0)-recebidoCompra(c); if($("#mDoc")&&c.obs&&/NF/i.test(c.obs)) $("#mDoc").value=c.obs; } };
    $("#fMov").onsubmit=async e=>{ e.preventDefault();
      const q=Number($("#mQtd").value)||0; const cond=$("#mCond").value; const r=stockCache.find(x=>x.sku===sku(it.value,tm.value))||{n:0,s:0,h:0};
      const d=movDelta({tipo,cond,qtd:q}); if(r.n+d.n<0||r.s+d.s<0||r.h+d.h<0){ toast("Quantidade maior que o saldo nessa condição."); return; }
      const ped=$("#mPed")?S.compras.find(x=>x._id===$("#mPed").value):null;
      if(tipo==="Entrada de compra" && $("#mPed") && !$("#mPed").value){ toast("Escolha o pedido ou “Sem pedido”."); return; }
      const doc={tipo,data:$("#mData").value,item:it.value,tam:tm.value,cond,qtd:q,pedido:ped?ped.pedido:"",doc:$("#mDoc")?$("#mDoc").value.trim():"",obs:$("#mObs").value.trim(),porId:S.me.id,criadoEm:new Date().toISOString()};
      $("#mSave").disabled=true;
      try{ await S.db.collection("movimentacoes").add(doc); closeModal(); toast("Lançado: "+tipo+" · "+doc.item+" "+doc.tam+" ("+q+")."); }catch(err){ failWrite(err); $("#mSave").disabled=false; }
    };
  });
}

let pdfP=null;
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
function loadPDF(){ if(!pdfP) pdfP=loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js").then(()=>loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js")).then(()=>{ const L=window.pdfjsLib; L.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; return L; }).catch(e=>{ pdfP=null; throw e; }); return pdfP; }
const numBR=v=>{ const s=String(v??"").trim(); if(!s) return 0; if(/,\d+$/.test(s)) return Number(s.replace(/\./g,"").replace(",","."))||0; return Number(s)||0; };
function lerXML(txt){
  const d=new DOMParser().parseFromString(txt,"text/xml"); if(d.getElementsByTagName("parsererror").length) throw new Error("xml");
  const T=(el,n)=>{ const x=el && el.getElementsByTagNameNS("*",n)[0]; return x?x.textContent.trim():""; };
  const ide=d.getElementsByTagNameNS("*","ide")[0], emit=d.getElementsByTagNameNS("*","emit")[0];
  const dets=[...d.getElementsByTagNameNS("*","det")]; if(!dets.length) throw new Error("semitens");
  return {numero:T(ide,"nNF"),serie:T(ide,"serie"),data:(T(ide,"dhEmi")||T(ide,"dEmi")).slice(0,10),fornecedor:T(emit,"xNome"),cnpj:T(emit,"CNPJ"),
    itens:dets.map(det=>{ const p=det.getElementsByTagNameNS("*","prod")[0]; return {desc:T(p,"xProd"),cod:T(p,"cProd"),un:T(p,"uCom"),qtd:Number(T(p,"qCom"))||0,vUnit:Number(T(p,"vUnCom"))||0}; })};
}
async function arquivoParaImagens(file){
  if(/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name)){
    const L=await loadPDF(); const pdf=await L.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const out=[];
    for(let i=1;i<=Math.min(pdf.numPages,4);i++){ const pg=await pdf.getPage(i); const vp=pg.getViewport({scale:2}); const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; out.push(await new Promise(r=>c.toBlob(r,"image/png"))); }
    return out;
  }
  return [file];
}
async function lerComClaude(file,status){
  const sample=S.sample; if(!sample) throw {code:"sem_claude"};
  const lim=await sample.limits().catch(()=>null); if(!lim||!lim.images) throw {code:"sem_imagem"};
  status("Preparando as páginas…"); let imgs=await arquivoParaImagens(file); imgs=imgs.slice(0,lim.images.maxImages||4);
  const cat=(S.cat.itens||[]).map(i=>`- ${i.nome} (tamanhos: ${SIZES[i.tipoTam].join(", ")})`).join("\n");
  status("O Claude está lendo a nota (leva de 20 a 60 segundos)…");
  const r=await sample.json(`Você está lendo uma nota fiscal brasileira (DANFE) de compra de EPI e fardamento. Extraia os dados exatamente como impressos.
Responda só com JSON neste formato:
{"numero":"27253","serie":"1","data":"AAAA-MM-DD (data de emissão)","fornecedor":"razão social do emitente","itens":[{"desc":"descrição do produto como na nota","cod":"código do produto","un":"unidade","qtd":5,"vUnit":83.34,"item":"nome do item do catálogo abaixo que corresponde, ou \\"\\" se nenhum","tam":"tamanho do produto (numeração do calçado ou PP/P/M/G/GG/XG/XXG), ou \\"\\" se não houver"}]}
Uma entrada por linha de produto da nota. Números com ponto decimal. O tamanho costuma estar no fim da descrição ou do código (ex.: -40, TAM 42, G).
Catálogo do estoque:
${cat}`,{images:imgs,modelTier:"default"});
  if(!r||!Array.isArray(r.itens)) throw {code:"invalid_json"};
  r.itens=r.itens.map(x=>({desc:String(x.desc||""),cod:String(x.cod||""),un:String(x.un||""),qtd:numBR(x.qtd),vUnit:numBR(x.vUnit),item:String(x.item||""),tam:String(x.tam||"").toUpperCase()}));
  return {numero:String(r.numero||""),serie:String(r.serie||""),data:dataISO(r.data)||String(r.data||"").slice(0,10),fornecedor:String(r.fornecedor||""),itens:r.itens};
}
function sugerirLinha(l){
  const itens=S.cat.itens||[];
  let item=itens.some(i=>i.nome===l.item)?l.item:"";
  if(!item){ const a=acharItem(l.desc); if(a) item=a.nome; }
  let tam=l.tam||"";
  if(item){ const sz=sizesOf(item);
    if(!sz.includes(tam)){ tam="";
      const src=(l.desc+" "+l.cod).toUpperCase();
      const nums=[...src.matchAll(/(?:^|[^0-9])(3[4-9]|4[0-6])(?![0-9])/g)].map(m=>m[1]);
      const cs=src.match(/[-_ ](\d{2})$/);
      if(itemInfo(item).tipoTam==="Calçado"){ tam=(cs&&sz.includes(cs[1]))?cs[1]:(nums.reverse().find(n=>sz.includes(n))||""); }
      else if(itemInfo(item).tipoTam==="Roupa"){ const t=src.split(/[^A-Z]+/).reverse().find(w=>sz.includes(w)); tam=t||""; }
      else tam="Único";
    }
  }
  return {...l,item,tam,inc:!!item};
}
function importarNF(){
  modal(`<header><div><h3>Importar nota fiscal</h3><p>O app lê fornecedor, número, itens, quantidades e valores. Você confere antes de lançar.</p></div><button class="x" data-close aria-label="Fechar">×</button></header>
  <div class="note">Use o <b>XML da NF-e</b>, que o fornecedor manda por e-mail junto com o PDF. A leitura é exata e imediata. Se o fornecedor não mandou, peça o XML a ele ou lance a compra à mão.</div>
  <div class="row"><label class="btn pri" for="nfFile" style="cursor:pointer">Escolher XML da nota</label><input id="nfFile" type="file" accept=".xml,text/xml,application/xml" hidden><span class="muted" id="nfNome"></span></div>
  <div id="nfOut"></div>`, ()=>{
    $("#nfFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; $("#nfNome").textContent=f.name; const out=$("#nfOut"); const st=m=>{ out.innerHTML=`<p class="muted">${esc(m)}</p>`; };
      try{ let nf;

    };
  });

async function gravarNF(){

  const g=[]; L.forEach(l=>{ const o=g.find(x=>x.item===l.item&&x.tam===l.tam); if(o){ o.vt+=l.qtd*l.vUnit; o.qtd+=l.qtd; } else g.push({item:l.item,tam:l.tam,qtd:l.qtd,vt:l.qtd*l.vUnit}); });
  g.forEach(x=>x.vUnit=x.qtd?Math.round(x.vt/x.qtd*100)/100:0);
  const novo=nf.pedido==="__novo"; const pedido=novo?"NF-"+nf.numero:nf.pedido; const docNF="NF "+nf.numero;
  const b=$("#nfGo"); b.disabled=true; b.textContent="Lançando…";

    if(nf.custo){ const custos={}; g.forEach(x=>{ if(x.vUnit) custos[x.item]=x.vUnit; }); if(Object.keys(custos).length && S.cat.itens.some(i=>custos[i.nome]!=null && Number(i.custo)!==custos[i.nome])) await S.db.doc("config/catalogo").update({itens:S.cat.itens.map(i=>custos[i.nome]!=null?{...i,custo:custos[i.nome]}:i)}); }

function vHist(){
  const ev=[];
  S.movs.forEach(m=>ev.push({d:m.data,c:m.criadoEm||m.data,t:`${m.tipo} · ${m.item} ${m.tam} (${m.qtd} ${String(m.cond).toLowerCase()})`,s:[m.pedido&&"pedido "+m.pedido,m.doc,m.obs].filter(Boolean).join(" · "),p:m.porId}));
  S.sols.forEach(s=>{ ev.push({d:s.data,c:s.criadoEm||s.data,t:`Admissão aberta · ${s.colaborador} (${s.num})`,s:`${s.empresa} · ${s.funcao}`,p:s.solicitanteId});
    if(s.entrega) ev.push({d:s.entrega.data,c:s.entrega.data,t:`Kit entregue · ${s.colaborador} (${s.num})`,s:(s.kit||[]).map(l=>`${l.qtd}× ${l.item} ${l.tam} ${l.cond||""}`).join(", "),p:s.entrega.porId});
    if(s.desligamento) ev.push({d:s.desligamento.data,c:s.desligamento.data,t:`Desligamento · ${s.colaborador} (${s.num})`,s:"",p:s.desligamento.porId});
    if(s.devolucao) ev.push({d:s.devolucao.data,c:s.devolucao.data,t:`Kit devolvido para higienização · ${s.colaborador} (${s.num})`,s:s.devolucao.tipo,p:s.devolucao.porId});
    if(s.cancelada) ev.push({d:s.cancelada.em,c:s.cancelada.em,t:`Admissão cancelada · ${s.colaborador} (${s.num})`,s:"",p:s.cancelada.porId}); });
  S.compras.forEach(c=>ev.push({d:c.data,c:c.criadoEm||c.data,t:`Pedido ${c.pedido} · ${c.qtd}× ${c.item} ${c.tam}`,s:c.fornecedor,p:c.porId}));

  const snapDoc=(c,id)=>{ const d=cache[c]?.get(id); return {id,exists:d!==undefined,data:()=>d,metadata:{fromCache:false}}; };
  const emit=c=>subs.filter(s=>s.c===c).forEach(s=>{ try{ s.cb(s.id!=null?snapDoc(c,s.id):snapColl(c)); }catch(e){ console.error(e); } });
  async function load(c){ const m=new Map(); for(let from=0;;from+=1000){ const {data,error}=await sb.from("docs").select("id,data").eq("coll",c).order("id").range(from,from+999); if(error) throw error; data.forEach(r=>m.set(r.id,r.data)); if(data.length<1000) break; } cache[c]=m; loaded[c]=true; emit(c); }
  function ensure(c,err){ if(!pending[c]) pending[c]=load(c).catch(e=>{ pending[c]=null; if(err) err(e); }); return pending[c]; }
  const E=error=>{ if(!error) return; const e=new Error(error.message); e.code=(error.code==="42501"||/row-level security/i.test(error.message))?"permission":(error.code||"erro"); throw e; };
  function ref(c,id){ return {
    id,
    async get(){ const {data,error}=await sb.from("docs").select("data").eq("coll",c).eq("id",id).maybeSingle(); E(error); return {exists:!!data,data:()=>data?.data}; },
    async set(obj){ const {error}=await sb.from("docs").upsert({coll:c,id,data:obj}); E(error); if(cache[c]){ cache[c].set(id,obj); emit(c); } },
    async update(patch){ const {data,error}=await sb.rpc("doc_merge",{p_coll:c,p_id:id,p_patch:patch}); E(error); if(cache[c]){ cache[c].set(id,data); emit(c); } },
    onSnapshot(cb,err){ subs.push({c,id,cb}); if(loaded[c]) cb(snapDoc(c,id)); else ensure(c,err); }
  }; }
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  return {
    doc(path){ const [c,id]=path.split("/"); return ref(c,id); },
    collection(c){ return { doc:id=>ref(c,id), async add(obj){ const id=newId(); await ref(c,id).set(obj); return {id}; }, onSnapshot(cb,err){ subs.push({c,cb}); if(loaded[c]) cb(snapColl(c)); else ensure(c,err); } }; },
    apply(row,del){ const c=row&&row.coll; if(!c||!cache[c]) return; if(del) cache[c].delete(row.id); else cache[c].set(row.id,row.data); emit(c); },
    reloadAll(){ return Promise.all(Object.keys(loaded).map(c=>load(c).catch(()=>{}))); }
  };
}
const dlSave={ async save({filename,data}){ const type=/\.html$/i.test(filename)?"text/html;charset=utf-8":/\.csv$/i.test(filename)?"text/csv;charset=utf-8":"application/octet-stream"; const blob=data instanceof Blob?data:new Blob([data],{type}); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); } };

function telaLogin(msg){
  $("#login").hidden=false; $("#lgErr").textContent=msg||""; live(false,"Sem login");
  const u=store.get("ultimoUsuario"); if(u&&!$("#lgU").value) $("#lgU").value=u;
  setTimeout(()=>($("#lgU").value?$("#lgS"):$("#lgU")).focus(),50);
}
$("#fLogin").onsubmit=async e=>{
  e.preventDefault(); const b=$("#lgBtn"); b.disabled=true; $("#lgErr").textContent="";
  const usuario=$("#lgU").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g,"");
  const email=usuario.includes("@")?usuario:usuario+DOM;
  const {data,error}=await sb.auth.signInWithPassword({email,password:$("#lgS").value});
  b.disabled=false;
  if(error){ $("#lgErr").textContent=/invalid/i.test(error.message)?"Usuário ou senha incorretos.":/banned/i.test(error.message)?"Seu acesso está desativado. Fale com o gestor.":"Não foi possível entrar agora. Confira a internet."; return; }
  store.set("ultimoUsuario",usuario.replace(DOM,"")); $("#lgS").value="";
  entrar(data.user);
};

let entrou=false;
async function entrar(user){
  const {data:p,error}=await sb.from("perfis").select("user_id,nome,usuario,papel,ativo").eq("user_id",user.id).maybeSingle();
  if(error){ return telaLogin("Não foi possível carregar seu acesso. Confira a internet."); }
  if(!p||!p.ativo){ await sb.auth.signOut(); return telaLogin("Seu acesso está desativado. Fale com o gestor."); }
  $("#login").hidden=true;
  if(entrou) return; entrou=true;
  const g=p.papel==="adm";
  S.me={id:user.id,name:p.nome,usuario:p.usuario,papelReal:p.papel,avatar:"",owner:g,canEdit:g};
  S.papel=g?(store.get("papel")||"adm"):p.papel;
  S.db=makeDb(); S.dl=dlSave; S.sample=null; S.perfis=[];
  route();
  await carregarPerfis();
  const db=S.db;
  const timer=setTimeout(()=>{ S.stale=true; live(false,"Sem resposta"); renderView(); },15000);
  const ok=()=>{ clearTimeout(timer); S.stale=false; };
  const err=e=>{ console.error(e); live(false,"Conexão perdida"); toast("Não foi possível carregar os dados. Recarregue a página."); };
  const coll=(name,key)=>db.collection(name).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({...d.data(),_id:d.id})); S.loaded[key]=true; ok(); sched(); },err);
  db.doc("config/catalogo").onSnapshot(d=>{ S.cat=d.exists?d.data():null; S.loaded.cat=true; ok(); sched(); },err);
  db.doc("config/alertas").onSnapshot(d=>{ S.alertCfg=d.exists?d.data():null; sched(); },err);
  db.doc("config/parametros").onSnapshot(d=>{ S.params=d.exists?d.data():{}; S.paramsExists=d.exists; sched(); },err);
  coll("solicitacoes","sols"); coll("movimentacoes","movs"); coll("compras","compras");
  let caiu=false;
  sb.channel("estoque").on("postgres_changes",{event:"*",schema:"public",table:"docs"},pl=>{ if(pl.eventType==="DELETE") db.apply(pl.old,true); else db.apply(pl.new); })
    .on("postgres_changes",{event:"*",schema:"public",table:"perfis"},()=>carregarPerfis())
    .subscribe(st=>{ if(st==="SUBSCRIBED"){ live(true,"Ao vivo"); if(caiu){ caiu=false; db.reloadAll(); carregarPerfis(); } } else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){ caiu=true; live(false,"Reconectando…"); } });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") db.reloadAll(); });
}
async function start(){
  route();
  if(!window.supabase){ S.dbFailed=true; live(false,"Sem conexão"); renderView(); return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==="SIGNED_OUT"){ location.reload(); } });
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return telaLogin();
  entrar(session.user);
}
start();
})();
</script>
